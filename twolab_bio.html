<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWOLAB® | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400;600;800&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #1a1e1b;
      --surface:  #F4F0EA;
      --border:   rgba(255,255,255,0.08);
      --text:     #e8e2d9;
      --muted:    rgba(232,226,217,0.45);
      --accent:   #8A9992;
      --hover-bg: #8A9992;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      min-height:100dvh;
      background:var(--bg);
      color:var(--text);
      font-family:'Noto Sans KR',sans-serif;
      font-weight:300;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:60px 24px 80px;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size:200px 200px;
    }
    .card {
      width:100%; max-width:420px;
      display:flex; flex-direction:column; align-items:center;
      animation:fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* 아바타 */
    .avatar-wrap { margin-bottom:22px; }
    .avatar {
      width:86px; height:86px; border-radius:50%;
      border:1px solid var(--border); display:block;
      background:#2a3a34;
      display:flex; align-items:center; justify-content:center;
      font-size:36px;
    }

    /* 이름 / 핸들 / 바이오 */
    .name {
      font-family:'Montserrat',sans-serif;
      font-size:1.65rem; font-weight:800;
      letter-spacing:0.18em; text-align:center;
      margin-bottom:6px;
    }
    .name sup { font-size:0.55em; font-weight:300; opacity:0.6; vertical-align:super; }
    .handle {
      font-family:'Montserrat',sans-serif;
      font-size:0.7rem; font-weight:400;
      letter-spacing:0.22em; color:var(--muted);
      text-align:center; margin-bottom:16px;
    }
    .bio {
      font-size:0.82rem; line-height:1.75;
      color:rgba(232,226,217,0.6);
      text-align:center; margin-bottom:28px;
      max-width:320px;
    }

    /* 구분선 */
    .divider {
      width:32px; height:1px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      margin:0 auto 28px;
    }

    /* 섹션 레이블 */
    .section-label {
      font-family:'Montserrat',sans-serif;
      font-size:0.62rem; font-weight:600;
      letter-spacing:0.25em; color:var(--muted);
      text-transform:uppercase; margin-bottom:14px;
      align-self:flex-start;
    }

    /* 링크 목록 */
    .links { width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:32px; }
    .link-item {
      display:flex; align-items:center; gap:14px;
      background:#8A9992;
      border:1px solid rgba(138,153,146,0.6);
      border-radius:12px;
      padding:14px 18px;
      text-decoration:none; color:#ffffff;
      transition:background 0.22s, border-color 0.22s, transform 0.18s;
      position:relative; overflow:hidden;
    }
    .link-item::before {
      content:''; position:absolute; inset:0;
      background:var(--hover-bg); opacity:0;
      transition:opacity 0.22s;
    }
    .link-item:hover { border-color:rgba(138,153,146,0.8); transform:translateY(-1px); }
    .link-item:hover::before { opacity:1; }
    .link-item:hover .link-title { color:#ffffff; }
    .link-item:hover .link-desc  { color:rgba(255,255,255,0.7); }
    .link-item:hover .link-arrow { opacity:1; color:#ffffff; }
    .link-icon { font-size:1.15rem; position:relative; z-index:1; flex-shrink:0; width:28px; text-align:center; }
    .link-content { flex:1; position:relative; z-index:1; }
    .link-title { font-family:'Montserrat',sans-serif; font-size:0.82rem; font-weight:600; letter-spacing:0.04em; color:#ffffff; transition:color 0.22s; }
    .link-desc  { font-size:0.7rem; color:rgba(255,255,255,0.7); margin-top:2px; letter-spacing:0.02em; transition:color 0.22s; }
    .link-arrow { font-size:0.85rem; color:rgba(255,255,255,0.6); opacity:0; transition:opacity 0.22s, color 0.22s; position:relative; z-index:1; }

    /* 소셜 아이콘 */
    .socials { display:flex; gap:12px; margin-bottom:36px; }
    .social-btn {
      width:40px; height:40px; border-radius:50%;
      border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); text-decoration:none;
      transition:border-color 0.2s, color 0.2s, background 0.2s;
    }
    .social-btn:hover { border-color:var(--accent); color:var(--text); background:rgba(138,153,146,0.12); }

    /* 언어 토글 */
    .lang-row { display:flex; gap:8px; margin-bottom:28px; }
    .lang-chip {
      font-family:'Montserrat',sans-serif; font-size:0.65rem;
      font-weight:600; letter-spacing:0.15em;
      padding:5px 14px; border-radius:20px; cursor:pointer;
      transition:all 0.2s;
      border:1px solid var(--border); color:var(--muted); background:transparent;
    }
    .lang-chip.active { background:var(--accent); color:#1a1e1b; border-color:var(--accent); }

    /* 푸터 */
    footer { font-family:'Montserrat',sans-serif; font-size:0.62rem; letter-spacing:0.12em; color:rgba(232,226,217,0.2); text-align:center; }
  </style>
</head>

    document.getElementById('chip-ko').classList.toggle('active', lang === 'ko');
    document.getElementById('chip-en').classList.toggle('active', lang === 'en');
    localStorage.setItem('twolab_lang', lang);
  }

  document.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('twolab_lang') || 'ko';
    setLang(saved);
  });
</script>
</body>
</html>
